<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Computer Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button, label.btn { display: block; width: 100%; background: #00e676; color: #000; border: none; padding: 15px 0; font-size: 16px; font-weight: bold; border-radius: 8px; margin: 10px 0; cursor: pointer; box-sizing: border-box; }
        label.btn-file { background: #00b0ff; color: #fff; }
        input[type="file"] { display: none; }
        .status { font-weight: bold; color: #ff5252; }
        .status.connected { color: #00e676; }
        .val-box { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .val { font-size: 32px; font-weight: bold; color: #00e676; }
        progress { width: 100%; margin-top: 10px; height: 12px; }
    </style>
</head>
<body>

    <h1>Bike Hub v0.2</h1>

    <div class="card">
        <h3>1. Display Koppeln</h3>
        <button id="btnConnect">Mit LilyGO verbinden</button>
        <p>Status: <span id="bleStatus" class="status">Nicht verbunden</span></p>
    </div>

    <div class="card">
        <h3>2. GPX Route auf Display laden</h3>
        <label for="gpxInput" class="btn btn-file">GPX-Datei auswählen</label>
        <input type="file" id="gpxInput" accept=".gpx">
        <p id="gpxStatus" style="color:#aaa; font-size:14px;">Keine Route geladen</p>
        <progress id="gpxProgress" value="0" max="100" style="display:none;"></progress>
    </div>

    <div class="card">
        <h3>3. Aktuelles Tempo</h3>
        <div class="val-box">
            <small>GPS Tempo</small>
            <div id="valSpeed" class="val">0.0 km/h</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
